<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedelia Informatique - Portail de téléchargement</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
</head>
<body>

  <header class="header">
    <a href="/" class="header-brand">
      <img src="/img/logo-header.svg" alt="Cedelia Informatique">
    </a>
    <nav class="header-nav">
      <a href="/admin.html" class="btn-admin">Administration</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Portail de téléchargement</h1>
    <p>Retrouvez ici tous les outils nécessaires pour votre assistance informatique</p>
  </section>

  <main class="container">
    <div class="filters" id="filters"></div>
    <div class="tools-grid" id="tools-grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
      </svg>
      <h3>Aucun outil disponible</h3>
      <p>Les outils seront bientôt disponibles au téléchargement.</p>
    </div>
  </main>

  <footer class="footer">
    &copy; 2024 <a href="https://www.cedelia.fr" target="_blank">Cedelia Informatique</a> — Tous droits réservés
  </footer>

<script>
const ICONS = {
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  size: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  version: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>'
};

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' o';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' Ko';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' Mo';
  return (bytes / 1073741824).toFixed(1) + ' Go';
}

let allTools = [];
let activeCategory = '';

async function loadTools() {
  const res = await fetch('/api/tools');
  allTools = await res.json();
  renderFilters();
  renderTools();
}

function renderFilters() {
  const categories = [...new Set(allTools.map(t => t.category))].sort();
  const container = document.getElementById('filters');

  let html = `<div class="search-box">${ICONS.search}<input type="text" placeholder="Rechercher un outil..." id="search-input" oninput="renderTools()"></div>`;
  html += `<button class="filter-btn active" onclick="setCategory('', this)">Tous</button>`;
  categories.forEach(cat => {
    html += `<button class="filter-btn" onclick="setCategory('${cat}', this)">${cat}</button>`;
  });
  container.innerHTML = html;
}

function setCategory(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTools();
}

function renderTools() {
  const search = (document.getElementById('search-input')?.value || '').toLowerCase();
  let filtered = allTools;

  if (activeCategory) filtered = filtered.filter(t => t.category === activeCategory);
  if (search) filtered = filtered.filter(t =>
    t.name.toLowerCase().includes(search) || t.description.toLowerCase().includes(search)
  );

  const grid = document.getElementById('tools-grid');
  const empty = document.getElementById('empty-state');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.hidden = false;
    return;
  }

  empty.hidden = true;
  grid.innerHTML = filtered.map(tool => {
    const btnStyle = tool.buttonColor ? `background:${tool.buttonColor}` : '';
    return `
      <div class="tool-card">
        <div class="tool-card-header">
          <h3>${esc(tool.name)}</h3>
          <span class="tool-badge">${esc(tool.category)}</span>
        </div>
        <p>${esc(tool.description)}</p>
        <div class="tool-meta">
          <span>${ICONS.version} v${esc(tool.version)}</span>
          <span>${ICONS.size} ${formatSize(tool.size)}</span>
        </div>
        <a href="/api/download/${tool.id}" class="btn-download" style="${btnStyle}">
          ${ICONS.download} Télécharger
        </a>
      </div>`;
  }).join('');
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

loadTools();
</script>
</body>
</html>
